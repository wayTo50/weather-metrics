services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: weather_metrics
      POSTGRES_USER: weather_metrics
      POSTGRES_PASSWORD: weather_metrics
    ports:
      - "5432:5432"
    volumes:
      - weather-metrics-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U weather_metrics" ]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  weather-metrics-data:

